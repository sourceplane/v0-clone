apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: VC-4
  title: "A baseline, in one landing"
spec:
  goal: v0-clone becomes an Orun baseline — a new app builder goes from nothing to live on stage and prod in one landing, both Workers deployed and smoke-tested
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - .baseline
    - tooling/rebrand
    - tooling/bootstrap
    - tooling/catalog
    - hooks
    - ai/context
    - docs/phases
    - BOOTSTRAP.md
    - testing
    - .github/workflows
  doneWhen:
    - Baseline CI is green — contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier
    - a product built from it carries the product only, renamed throughout to its own name, repository and Workers
  gates: []
