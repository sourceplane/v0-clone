apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: VC-1
  title: "The spec"
spec:
  goal: The v0-clone repository's scaffold and its epic — intent, CI, tooling, spec index, doc set and task contracts — are on main
  affects:
    - intent.yaml
    - .github/workflows/ci.yml
    - tooling
    - specs
    - tasks
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - turbo.json
    - README.md
  doneWhen:
    - epic.yaml, README, design, implementation plan, risks and status are merged
    - the four task contracts exist
  gates: []
